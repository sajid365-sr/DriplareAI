<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driplare AI Settings</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #0f172a;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #7c3aed;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      background: #7c3aed;
      color: white;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      background: #6d28d9;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      color: #10b981;
    }
  </style>
</head>
<body>
  <h3>Driplare AI Copilot</h3>
  <label for="apiUrl">Driplare App URL</label>
  <input type="text" id="apiUrl" placeholder="https://driplare.com">

  <label for="apiKey">API Key / Token</label>
  <input type="password" id="apiKey" placeholder="sk-...">

  <button id="saveBtn">Save Settings</button>
  <div id="status" class="status"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      chrome.storage.sync.get(["apiUrl", "apiKey"], (items) => {
        if (items.apiUrl) document.getElementById("apiUrl").value = items.apiUrl;
        if (items.apiKey) document.getElementById("apiKey").value = items.apiKey;
      });

      document.getElementById("saveBtn").addEventListener("click", () => {
        const apiUrl = document.getElementById("apiUrl").value.trim() || "https://driplare.com";
        const apiKey = document.getElementById("apiKey").value.trim();
        chrome.storage.sync.set({ apiUrl, apiKey }, () => {
          const status = document.getElementById("status");
          status.textContent = "Settings saved!";
          setTimeout(() => { status.textContent = ""; }, 2000);
        });
      });
    });
  </script>
</body>
</html>
